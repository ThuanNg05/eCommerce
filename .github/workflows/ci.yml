name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET build, test and audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore tools and packages
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet restore eCommerce.sln

      - name: Build Release
        run: dotnet build eCommerce.sln --configuration Release --no-restore

      - name: Run tests with coverage
        run: >-
          dotnet test eCommerce.sln
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=security-tests.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Audit NuGet packages
        shell: pwsh
        run: ./scripts/Test-NuGetVulnerabilities.ps1

      - name: Publish desktop artifact
        run: >-
          dotnet publish src/WarehouseApp.Desktop/WarehouseApp.Desktop.csproj
          --configuration Release
          --no-build
          --no-restore
          --no-self-contained
          --output artifacts/desktop

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-results
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload desktop artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warehouse-desktop-framework-dependent
          path: artifacts/desktop/**
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: React build and production audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build TypeScript and Vite bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload React bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist/**
          if-no-files-found: error
          retention-days: 14

  migrations:
    name: Migration consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate migration files and schema version
        shell: pwsh
        run: ./scripts/Test-Migrations.ps1

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
