name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET build, test and audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore tools and packages
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet restore eCommerce.sln

      - name: Build Release
        run: dotnet build eCommerce.sln --configuration Release --no-restore

      - name: Run tests with coverage
        run: >-
          dotnet test eCommerce.sln
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=security-tests.trx"
          --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Audit NuGet packages
        shell: pwsh
        run: ./scripts/Test-NuGetVulnerabilities.ps1

      - name: Set up Node.js for desktop bundle
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build React bundle for desktop artifact
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish desktop artifact
        run: >-
          dotnet publish src/WarehouseApp.Desktop/WarehouseApp.Desktop.csproj
          --configuration Release
          --no-build
          --no-restore
          --no-self-contained
          --output artifacts/desktop

      - name: Verify desktop artifact contains React bundle
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/desktop/WarehouseApp.Desktop.exe)) {
            throw 'Desktop executable is missing from the publish artifact.'
          }
          if (-not (Test-Path artifacts/desktop/wwwroot/index.html)) {
            throw 'React bundle is missing from the desktop publish artifact.'
          }

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warehouse-desktop-framework-dependent
          path: artifacts/desktop/**
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: React build and production audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build TypeScript and Vite bundle
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload React bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/**
          if-no-files-found: error
          retention-days: 14

  migrations:
    name: Migration consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate migration files and schema version
        shell: pwsh
        run: ./scripts/Test-Migrations.ps1

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
